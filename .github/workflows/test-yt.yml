name: test-youtube
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - run: |
          python - <<'PY'
          import requests, re
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36", "Accept-Language": "fr-FR"}
          for vid in ["MFJIf1isXwI", "RcVz-aB3F0c"]:
              r = requests.get(f"https://www.youtube.com/shorts/{vid}", headers=UA, timeout=30)
              t = r.text
              print("PAGE", vid, r.status_code, len(t), "len=", re.findall(r'"lengthSeconds":"(\d+)"', t)[:1], "likes=", re.findall(r'"likeCount":"?(\d+)', t)[:1],
                    "pub=", re.findall(r'"publishDate":"([^"]+)"', t)[:1], "vues=", re.findall(r'"viewCount":"(\d+)"', t)[:1])
              for th in ("oardefault.jpg", "oar2.jpg", "hq2.jpg", "hqdefault.jpg"):
                  q = requests.get(f"https://i.ytimg.com/vi/{vid}/{th}", timeout=30)
                  print("  THUMB", th, q.status_code, len(q.content))
          r = requests.get("https://www.youtube.com/feeds/videos.xml?channel_id=UC4PZX4pqE4sT2eb7wskIyIQ", timeout=30)
          print("RSS likes", re.findall(r'starRating count="(\d+)"', r.text)[:3], re.findall(r"<published>([^<]+)", r.text)[:3])
          PY
