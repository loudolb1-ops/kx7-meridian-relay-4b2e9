name: robot-insta
# Le robot Instagram d'AXIOM (voir robot/robot.py). Réveil principal (9 oct. : les crons GitHub partaient avec des
# heures de retard, ou pas du tout) = Upstash QStash « jarvis-reveil » (projet Vercel de JARVIS), qui lance
# workflow_dispatch à la minute pile, heure de Paris : mode=slot à 08:00 · 12:30 · 17:30 · 20:30, mode=report à 06:37.
# Les crons ci-dessous restent en secours. GitHub ne connaît que l'heure UTC : chaque créneau de Paris
# (08:00, 12:30, 17:30, 20:30) a deux déclenchements, été (UTC+2) et hiver (UTC+1) ; robot/slots.py ne laisse
# passer que celui qui tombe à l'heure. Minutes décalées (:04, :34) : GitHub est saturé aux heures pile.
on:
  schedule:
    - cron: "4 6,7 * * *"
    - cron: "34 10,11 * * *"
    - cron: "34 15,16 * * *"
    - cron: "34 18,19 * * *"
    - cron: "37 4,5 * * *"   # rapport JARVIS du matin (06:37 Paris, été comme hiver)
  workflow_dispatch:
    inputs:
      mode:
        description: "slot = créneau normal ; --force = même déjà servi ; --dry = à blanc (rien publié)"
        type: choice
        default: slot
        options: [slot, "slot --force", "slot --force --dry", track, status, report, meta, fbplan, "fbplan --dry"]
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # le dernier état (slots.json…), pas celui du moment du déclenchement : un passage mis en file derrière un autre
      # (QStash + secours GitHub) doit voir le créneau déjà servi, sinon il republie
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: due
        run: |
          mode="${{ inputs.mode || 'slot' }}"
          if [ "${{ github.event.schedule }}" = "37 4,5 * * *" ]; then
            mode=report; python3 robot/slots.py --report && echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || python3 robot/slots.py; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - if: steps.due.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.due.outputs.go == '1'
        name: outils
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          curl -sSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp && sudo mv /tmp/rclone-*-linux-amd64/rclone /usr/local/bin/
          pip install -q -r requirements.txt
          npm ci --silent
      - if: steps.due.outputs.go == '1'
        name: accès OneDrive
        env:
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
        run: |
          mkdir -p secret
          openssl enc -d -aes-256-cbc -pbkdf2 -in state/onedrive.enc -out secret/rclone.conf -pass env:ROBOT_KEY
          cp secret/rclone.conf secret/rclone.conf.avant
      - if: steps.due.outputs.go == '1'
        name: robot
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BLOB_TOKEN: ${{ secrets.BLOB_TOKEN }}
          BLOB_PRIVE_TOKEN: ${{ secrets.BLOB_PRIVE_TOKEN }}
          JARVIS_ROBOT_TOKEN: ${{ secrets.JARVIS_ROBOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          mode="${{ steps.due.outputs.mode }}"
          # meta = rapport rapide (après un créneau, ou une vidéo arrivée dans OneDrive) : rangement 00 / 01 d après les
          # validations de Lou dans JARVIS (12 oct.), sans relire ses comptes ni les stats détaillées du matin
          if [ "$mode" = "report" ]; then python robot/report.py
            # Facebook toujours programmé 7 jours à l'avance (Lou, 10 oct.) : le matin, on complète la semaine
            python robot/robot.py fbplan || echo "programmation Facebook en échec"
          elif [ "${mode%% *}" = "fbplan" ]; then python robot/robot.py $mode
          elif [ "$mode" = "meta" ]; then python robot/report.py --meta; else
            python robot/robot.py $mode
            # le post du créneau apparaît tout de suite dans le rapport de JARVIS (Instagram + Facebook)
            case "$mode" in slot*) python robot/report.py --meta || echo "rapport non mis à jour";; esac
          fi
          python robot/robot.py status >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.due.outputs.go == '1'
        name: sauvegarde de l'état
        env:
          ROBOT_KEY: ${{ secrets.ROBOT_KEY }}
        run: |
          # le jeton OneDrive se renouvelle : on garde le nouveau (chiffré)
          if [ -f secret/rclone.conf ] && ! cmp -s secret/rclone.conf secret/rclone.conf.avant; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in secret/rclone.conf -out state/onedrive.enc -pass env:ROBOT_KEY
          fi
          git config user.name "robot-insta"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          # un commit de code arrivé pendant le passage ne doit pas faire perdre l'état (9 oct. : push refusé)
          git diff --cached --quiet || (git commit -q -m "état $(date -u +%F\ %H:%M)" && (git push -q || (git pull --rebase -q && git push -q)))
